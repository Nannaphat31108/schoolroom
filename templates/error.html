{% extends "layout.html" %}
{% from "icons.html" import icon %}
{% block title %}{{ code }} | {{ title }}{% endblock %}
{% block content %}
<div class="error-state">
    <span class="error-code">{{ code }}</span>
    <span class="error-icon">{{ icon('shield' if code == 403 else 'info', 30) }}</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">{{ icon('home', 17) }} กลับหน้าหลัก</a>
</div>
{% endblock %}
